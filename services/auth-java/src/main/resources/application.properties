spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:ecommerce}
spring.datasource.username=${POSTGRES_USER:ecommerce}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.port=${SERVER_PORT:8081}
jwt.secret=${JWT_SECRET:dev-secret-key-that-is-at-least-256-bits-long-for-hs256}
jwt.expiration-ms=86400000
