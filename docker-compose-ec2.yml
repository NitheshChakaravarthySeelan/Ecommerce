services:
  zookeeper:
    image: zookeeper:3.8.1
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - 2181:2181

  kafka:
    image: confluentinc/cp-kafka:7.4.1
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_LOG_RETENTION_HOURS=1
    ports:
      - 9092:9092
    depends_on:
      - zookeeper

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: ecommerce
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  api-gateway:
    image: nith141/api-gateway:v2
    ports:
      - 3001:3001
      - 80:3001
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-long-random-secret-in-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - CATALOG_URL=http://catalog-rust:8084
      - INVENTORY_URL=http://inventory-rust:8085
      - CART_URL=http://cart-python:8086
      - ORDER_URL=http://order-python:8087
      - PAYMENT_URL=http://payment-python:8088
      - AUTH_URL=http://auth-java:8081
      - SAGA_URL=http://saga-java:8083
      - SHIPPING_URL=http://shipping-java:8082
      - ORCHESTRATOR_URL=http://orchestrator-java:8089
    depends_on:
      - auth-java
      - catalog-rust
      - inventory-rust
      - cart-python
      - order-python
      - payment-python
      - saga-java
      - shipping-java

  auth-java:
    image: nith141/auth-java:v1
    ports:
      - 8081:8081
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms128m
      - SERVER_PORT=8081
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=ecommerce
      - POSTGRES_USER=ecommerce
      - POSTGRES_PASSWORD=changeme
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-long-random-secret-in-production}
    depends_on:
      - postgres

  shipping-java:
    image: nith141/shipping-java:v1
    ports:
      - 8082:8082
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms128m
      - SERVER_PORT=8082
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=ecommerce
      - POSTGRES_USER=ecommerce
      - POSTGRES_PASSWORD=changeme
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres
      - kafka

  saga-java:
    image: nith141/saga-java:v1
    ports:
      - 8083:8083
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms128m
      - SERVER_PORT=8083
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=ecommerce
      - POSTGRES_USER=ecommerce
      - POSTGRES_PASSWORD=changeme
    depends_on:
      - kafka
      - postgres

  orchestrator-java:
    image: nith141/orchestrator-java:v1
    ports:
      - 8089:8089
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms128m
      - SERVER_PORT=8089
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=ecommerce
      - POSTGRES_USER=ecommerce
      - POSTGRES_PASSWORD=changeme
      - INVENTORY_URL=http://inventory-rust:8085
      - ORDER_URL=http://order-python:8087
    depends_on:
      - kafka
      - postgres

  catalog-rust:
    image: nith141/catalog-rust:v2
    ports:
      - 8084:8084
    environment:
      - DATABASE_URL=postgres://ecommerce:changeme@postgres:5432/ecommerce
    depends_on:
      - postgres

  inventory-rust:
    image: nith141/inventory-rust:v1
    ports:
      - 8085:8085
    environment:
      - DATABASE_URL=postgres://ecommerce:changeme@postgres:5432/ecommerce
    depends_on:
      - postgres

  cart-python:
    image: nith141/cart-python:v1
    ports:
      - 8086:8086
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  order-python:
    image: nith141/order-python:v1
    ports:
      - 8087:8087
    environment:
      - DATABASE_URL=postgresql+psycopg://ecommerce:changeme@postgres:5432/ecommerce
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres
      - kafka

  payment-python:
    image: nith141/payment-python:v1
    ports:
      - 8088:8088
    environment:
      - DATABASE_URL=postgresql+psycopg://ecommerce:changeme@postgres:5432/ecommerce
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres
      - kafka

  frontend:
    image: nith141/frontend:v1
    ports:
      - 3000:3000
    depends_on:
      - auth-java
      - catalog-rust
      - cart-python
      - order-python
      - payment-python

volumes:
  postgres-data:
  redis-data:
